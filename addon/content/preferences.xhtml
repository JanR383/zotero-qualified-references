<vbox
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
>
  <html:link rel="localization" href="qref-addon.ftl" />
  <!-- Grouped by where a setting takes effect. Pref keys are unchanged. -->
  <groupbox style="margin-bottom: 20px">
    <html:h2 data-l10n-id="prefs-pane-title"></html:h2>
    <html:label data-l10n-id="prefs-pane-fields" />
    <vbox style="margin-inline-start: 16px">
      <checkbox
        preference="displayPaneAuthor"
        data-l10n-id="prefs-field-author"
      />
      <checkbox preference="displayPaneYear" data-l10n-id="prefs-field-year" />
      <checkbox
        preference="displayPaneTitle"
        data-l10n-id="prefs-field-title"
      />
    </vbox>
    <checkbox
      preference="stanceControlCompact"
      data-l10n-id="prefs-stance-compact"
    />
    <hbox align="center">
      <html:label data-l10n-id="prefs-comment-max" for="qref-comment-max" />
      <html:input
        id="qref-comment-max"
        type="number"
        min="100"
        max="10000"
        step="100"
        style="width: 6em"
        preference="commentMaxLength"
      />
    </hbox>
  </groupbox>
  <groupbox style="margin-bottom: 20px">
    <html:h2 data-l10n-id="prefs-graph-title"></html:h2>
    <html:label data-l10n-id="prefs-graph-fields" />
    <vbox style="margin-inline-start: 16px">
      <checkbox
        preference="displayGraphAuthor"
        data-l10n-id="prefs-field-author"
      />
      <checkbox preference="displayGraphYear" data-l10n-id="prefs-field-year" />
      <checkbox
        preference="displayGraphTitle"
        data-l10n-id="prefs-field-title"
      />
    </vbox>
    <checkbox
      preference="graphColorByType"
      data-l10n-id="prefs-graph-colorbytype"
    />
    <checkbox
      preference="graphExportTransparent"
      data-l10n-id="prefs-graph-export-transparent"
    />
    <html:label data-l10n-id="prefs-graph-controls" style="margin-top: 8px" />
    <vbox style="margin-inline-start: 16px">
      <checkbox
        preference="graphShowSearch"
        data-l10n-id="prefs-graph-show-search"
      />
      <checkbox
        preference="graphShowFilters"
        data-l10n-id="prefs-graph-show-filters"
      />
      <checkbox
        preference="graphShowTags"
        data-l10n-id="prefs-graph-show-tags"
      />
      <checkbox
        preference="graphShowSizeToggle"
        data-l10n-id="prefs-graph-show-size"
      />
      <checkbox
        preference="graphShowLinkDistance"
        data-l10n-id="prefs-graph-show-distance"
      />
      <checkbox
        preference="graphShowTimeline"
        data-l10n-id="prefs-graph-show-timeline"
      />
    </vbox>
    <html:p
      class="description"
      data-l10n-id="prefs-graph-controls-desc"
    ></html:p>
  </groupbox>
  <groupbox style="margin-bottom: 20px">
    <html:h2 data-l10n-id="prefs-reader-title"></html:h2>
    <checkbox
      preference="readerSelectionButton"
      data-l10n-id="prefs-reader-selection-button"
    />
  </groupbox>
  <groupbox style="margin-bottom: 20px">
    <html:h2 data-l10n-id="prefs-colors-title"></html:h2>
    <hbox align="center">
      <html:label data-l10n-id="prefs-palette-label" for="qref-palette" />
      <menulist id="qref-palette" preference="stancePalette">
        <menupopup>
          <menuitem value="default" data-l10n-id="prefs-palette-default" />
          <menuitem
            value="colorblind"
            data-l10n-id="prefs-palette-colorblind"
          />
        </menupopup>
      </menulist>
    </hbox>
  </groupbox>
  <groupbox style="margin-bottom: 20px">
    <html:h2 data-l10n-id="prefs-privacy-title"></html:h2>
    <checkbox
      preference="copyRefsToGroup"
      data-l10n-id="prefs-copy-refs-to-group"
    />
    <html:p
      class="description"
      data-l10n-id="prefs-copy-refs-to-group-desc"
    ></html:p>
  </groupbox>
  <groupbox style="margin-bottom: 20px">
    <html:h2 data-l10n-id="prefs-backup-title"></html:h2>
    <html:p class="description" data-l10n-id="prefs-backup-desc"></html:p>
    <hbox>
      <button
        data-l10n-id="prefs-backup-button"
        oncommand="Zotero.QRef.api.backUpReferences(window)"
      />
      <button
        data-l10n-id="prefs-restore-button"
        oncommand="Zotero.QRef.api.restoreReferences(window)"
      />
    </hbox>
  </groupbox>
</vbox>

<?xml version="1.0" encoding="UTF-8"?>
<html class="qref-window" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <!-- qref.css provides the stance colour custom properties (theme-aware)
         and the shared window chrome; graph.js reads the computed colour
         values for the canvas. -->
    <link rel="stylesheet" href="chrome://qref/content/qref.css" />
    <style>
      html,
      body {
        overflow: hidden;
      }
      #graph {
        width: 100vw;
        height: 100vh;
      }
      #legend {
        position: fixed;
        top: 10px;
        left: 10px;
        padding: 8px 10px;
        border-radius: 6px;
        background: color-mix(in srgb, Canvas 85%, transparent);
        border: 1px solid var(--material-border-quarternary, #ccc);
        font-size: 12px;
        line-height: 1.6;
        pointer-events: none;
      }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .legend-swatch {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 3px;
        flex: 0 0 auto;
      }
      .legend-type-glyph {
        display: inline-block;
        width: 16px;
        font-size: 16px;
        line-height: 1;
        flex: 0 0 auto;
      }
      #controls {
        position: fixed;
        top: 10px;
        right: 10px;
        padding: 8px 10px;
        border-radius: 6px;
        background: color-mix(in srgb, Canvas 85%, transparent);
        border: 1px solid var(--material-border-quarternary, #ccc);
        font-size: 12px;
        line-height: 1.6;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }
      #controls .control-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #controls input[type="range"] {
        width: 120px;
      }
      #empty {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        opacity: 0.7;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="graph"></div>
    <div id="legend"></div>
    <div id="controls">
      <div class="control-row">
        <label id="scope-label"></label>
        <div id="scope"></div>
      </div>
      <div class="control-row">
        <label id="link-distance-label" for="link-distance"></label>
        <input id="link-distance" type="range" min="10" max="200" step="5" />
      </div>
    </div>
    <div id="empty"></div>
    <script src="chrome://qref/content/scripts/graph.js"></script>
  </body>
</html>

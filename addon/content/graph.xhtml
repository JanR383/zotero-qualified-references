<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <!-- qref.css provides the stance colour custom properties (theme-aware);
         graph.js reads their computed values for the canvas. -->
    <link rel="stylesheet" href="chrome://qref/content/qref.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        color: #1a1a1a;
        font: 13px sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #1c1c1e;
          color: #e8e8e8;
        }
      }
      #graph {
        width: 100vw;
        height: 100vh;
      }
      #legend {
        position: fixed;
        top: 10px;
        left: 10px;
        padding: 8px 10px;
        border-radius: 6px;
        background: color-mix(in srgb, Canvas 85%, transparent);
        border: 1px solid var(--material-border-quarternary, #ccc);
        font-size: 12px;
        line-height: 1.6;
        pointer-events: none;
      }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .legend-swatch {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 3px;
        flex: 0 0 auto;
      }
      #empty {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        opacity: 0.7;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="graph"></div>
    <div id="legend"></div>
    <div id="empty"></div>
    <script src="chrome://qref/content/scripts/graph.js"></script>
  </body>
</html>

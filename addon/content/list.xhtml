<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="chrome://qref/content/qref.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #ffffff;
        color: #1a1a1a;
        font: 13px sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #1c1c1e;
          color: #e8e8e8;
        }
      }
      #list {
        padding: 8px 10px 20px;
      }
      .node {
        border-bottom: 1px solid var(--material-border-quarternary, #ddd);
      }
      .node-head {
        display: flex;
        align-items: baseline;
        gap: 6px;
        padding: 5px 2px;
        cursor: pointer;
      }
      .caret {
        width: 1em;
        flex: 0 0 auto;
        opacity: 0.7;
      }
      .node-title {
        font-weight: bold;
      }
      .node-title:hover {
        text-decoration: underline;
      }
      .node-body {
        padding: 2px 0 8px 22px;
      }
      .section {
        margin: 4px 0;
      }
      .section-head {
        font-size: 0.85em;
        opacity: 0.7;
        margin-bottom: 2px;
      }
      .entry {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 1px 0;
      }
      .pill {
        display: inline-block;
        min-width: 16px;
        text-align: center;
        padding: 0 6px;
        border-radius: 8px;
        font-size: 0.8em;
        color: var(--qref-stance-fg);
        flex: 0 0 auto;
      }
      .entry-label {
        cursor: pointer;
      }
      .entry-label:hover {
        text-decoration: underline;
      }
      #empty {
        display: none;
        text-align: center;
        margin-top: 40px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="list"></div>
    <div id="empty"></div>
    <script src="chrome://qref/content/scripts/list.js"></script>
  </body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<html class="qref-window" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="chrome://qref/content/qref.css" />
    <style>
      #toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 8px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--material-border-quarternary, #ddd);
        font-size: 0.92em;
      }
      #toolbar #scope {
        max-width: 260px;
      }
      #search {
        flex: 1 1 150px;
        min-width: 130px;
        max-width: 300px;
      }
      .spacer {
        flex: 1 1 auto;
      }
      #list {
        padding: 4px 6px 20px;
      }
      .node {
        border-bottom: 1px solid var(--material-border-quarternary, #e4e4e4);
      }
      .node.open {
        background: color-mix(in srgb, currentColor 4%, transparent);
      }
      /* Collapsed row: caret | title | tag dots | ± | incoming | outgoing,
         the last two as fixed columns so the numbers line up. */
      .node-head {
        display: grid;
        grid-template-columns: 1em minmax(0, 1fr) auto 1em 7.5em 7.5em;
        align-items: center;
        column-gap: 6px;
        padding: 3px 4px;
        cursor: pointer;
      }
      .node-head:hover {
        background: color-mix(in srgb, currentColor 7%, transparent);
      }
      .node-head:focus-visible {
        outline: 2px solid var(--color-accent, Highlight);
        outline-offset: -2px;
      }
      .caret {
        opacity: 0.6;
      }
      .node-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .node.open .node-title {
        white-space: normal;
        font-weight: 600;
      }
      .node-title:hover {
        text-decoration: underline;
      }
      .tags {
        display: inline-flex;
        gap: 2px;
      }
      .tag-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        cursor: help;
      }
      .contested {
        text-align: center;
        font-weight: 600;
        cursor: help;
      }
      .dir {
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
        gap: 5px;
        font-size: 0.9em;
        font-variant-numeric: tabular-nums;
      }
      .dir-count {
        opacity: 0.8;
        white-space: nowrap;
      }
      /* Diverging stance bar (stanceBar in list/index.ts). Each half is laid
         out from the outside in towards the centre line. */
      .bar {
        position: relative;
        display: inline-flex;
        height: 10px;
      }
      .bar::after {
        content: "";
        position: absolute;
        left: 50%;
        top: -2px;
        bottom: -2px;
        width: 1px;
        background: currentColor;
        opacity: 0.45;
      }
      .bar-half {
        display: flex;
        gap: 1px;
        width: 30px;
        justify-content: flex-end;
      }
      .bar-half.pos {
        flex-direction: row-reverse;
      }
      .bar-seg,
      .bar-neutral {
        flex: 0 0 auto;
        height: 100%;
      }
      .node-body {
        padding: 0 8px 8px 26px;
      }
      .section {
        margin-top: 4px;
      }
      .section-head {
        font-size: 0.85em;
        opacity: 0.75;
        margin: 2px 0;
      }
      /* Expanded entry: pill | label, pages and PDF link, comment. */
      .entry {
        display: grid;
        grid-template-columns: 2.4em minmax(0, 1fr);
        column-gap: 6px;
        align-items: baseline;
        padding: 2px 0;
      }
      .pill {
        justify-self: start;
        min-width: 1.6em;
        text-align: center;
        padding: 0 5px;
        border-radius: 8px;
        font-size: 0.8em;
        color: var(--qref-stance-fg);
      }
      .entry-label {
        cursor: pointer;
      }
      .entry-label:hover {
        text-decoration: underline;
      }
      .entry-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0 10px;
        font-size: 0.85em;
        opacity: 0.75;
      }
      .entry-pdf {
        cursor: pointer;
        color: var(--color-accent, LinkText);
      }
      .entry-pdf:hover {
        text-decoration: underline;
      }
      .entry-comment {
        font-size: 0.9em;
        opacity: 0.85;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      .entry-comment.open {
        white-space: pre-wrap;
      }
      #empty {
        display: none;
        text-align: center;
        margin-top: 40px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <div id="scope"></div>
      <input id="search" type="search" />
      <span id="stance-filter"></span>
      <span id="tags"></span>
      <span id="show"></span>
      <span id="sort"></span>
      <span class="spacer"></span>
      <button id="toggle-all"></button>
      <span id="export"></span>
    </div>
    <div id="list"></div>
    <div id="empty"></div>
    <script src="chrome://qref/content/scripts/list.js"></script>
  </body>
</html>

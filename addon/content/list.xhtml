<?xml version="1.0" encoding="UTF-8"?>
<html class="qref-window" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="chrome://qref/content/qref.css" />
    <style>
      #toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--material-border-quarternary, #ddd);
        font-size: 12px;
      }
      #toolbar #scope {
        max-width: 320px;
      }
      #search {
        width: 180px;
      }
      .stance-filter {
        display: inline-flex;
        gap: 6px;
      }
      .stance-filter label {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        cursor: pointer;
      }
      .spacer {
        flex: 1 1 auto;
      }
      #list {
        padding: 8px 10px 20px;
      }
      .node {
        border-bottom: 1px solid var(--material-border-quarternary, #ddd);
      }
      .node-head:focus-visible {
        outline: 2px solid var(--color-accent, Highlight);
        outline-offset: -2px;
      }
      .node-head {
        display: flex;
        align-items: baseline;
        gap: 6px;
        padding: 5px 2px;
        cursor: pointer;
      }
      .balance {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
        font-size: 0.9em;
        opacity: 0.85;
      }
      .caret {
        width: 1em;
        flex: 0 0 auto;
        opacity: 0.7;
      }
      .node-title {
        font-weight: bold;
      }
      .node-title:hover {
        text-decoration: underline;
      }
      .node-body {
        padding: 2px 0 8px 22px;
      }
      .section {
        margin: 4px 0;
      }
      .section-head {
        font-size: 0.85em;
        opacity: 0.7;
        margin-bottom: 2px;
      }
      .entry {
        padding: 1px 0;
      }
      .entry-line {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 7px;
      }
      .entry-pages {
        font-size: 0.85em;
        opacity: 0.7;
      }
      .entry-pdf {
        font-size: 0.85em;
        cursor: pointer;
        color: var(--color-accent, LinkText);
      }
      .entry-pdf:hover {
        text-decoration: underline;
      }
      .entry-comment {
        margin: 0 0 2px 30px;
        font-size: 0.9em;
        opacity: 0.8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      .entry-comment.open {
        white-space: pre-wrap;
      }
      .pill {
        display: inline-block;
        min-width: 16px;
        text-align: center;
        padding: 0 6px;
        border-radius: 8px;
        font-size: 0.8em;
        color: var(--qref-stance-fg);
        flex: 0 0 auto;
      }
      .entry-label {
        cursor: pointer;
      }
      .entry-label:hover {
        text-decoration: underline;
      }
      #empty {
        display: none;
        text-align: center;
        margin-top: 40px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <label id="scope-label"></label>
      <div id="scope"></div>
      <input id="search" type="search" />
      <span id="stance-filter"></span>
      <span id="sort"></span>
      <span class="spacer"></span>
      <button id="expand-all"></button>
      <button id="collapse-all"></button>
      <span id="export"></span>
    </div>
    <div id="list"></div>
    <div id="empty"></div>
    <script src="chrome://qref/content/scripts/list.js"></script>
  </body>
</html>

name: Release

on:
  push:
    tags:
      - v**

permissions:
  contents: write

# Self-contained on purpose: the release job holds a write token, so every
# action it runs is pinned to a commit (Dependabot keeps the pins current).
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # keep in sync with .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Release to GitHub
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
